packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@nestjs/core": true
  "@prisma/client": true
  "@prisma/engines": true
  "prisma": true
  "unrs-resolver": true
  "@embedded-postgres/linux-x64": true
  "bcrypt": true
  msgpackr-extract: true
  '@scarf/scarf': false

minimumReleaseAgeExclude:
  - "pnpm@11.13.0"
